name: 组合持仓每日刷新

on:
  schedule:
    # 交易日 06:00 北京时区 (= 22:00 UTC 前一日) 美股收盘后刷新，覆盖A股/港股/美股全部数据
    - cron: '0 22 * * 0-4'
  workflow_dispatch:    # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 设置 Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install beautifulsoup4 lxml

      - name: 刷新持仓数据
        id: refresh
        run: python refresh.py
        timeout-minutes: 120

      - name: 上传部署产物
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0