name: 组合持仓每日刷新

on:
  schedule:
    # 交易日 16:30 北京时区 (= 08:30 UTC) 收盘后刷新
    - cron: '30 8 * * 1-5'
  workflow_dispatch:    # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install beautifulsoup4 lxml

      - name: 刷新持仓数据
        id: refresh
        run: python refresh.py
        timeout-minutes: 120

      - name: 上传部署产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4